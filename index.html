<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BlockCraft</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f3efe2;
    --ink-dim: #b9b3a0;
    --panel: rgba(18, 20, 16, 0.78);
    --panel-edge: #3c4234;
    --slot: rgba(30, 32, 26, 0.72);
    --slot-edge: #5b6150;
    --accent: #8fd14f;
    --shadow: #1b1d17;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0d0f0b; color: var(--ink);
    font-family: "Silkscreen", "VT323", ui-monospace, Menlo, Consolas, monospace; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #water-tint { position: fixed; inset: 0; background: rgba(30, 70, 170, 0.35); pointer-events: none; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; mix-blend-mode: difference; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }
  #info { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); font-size: 13px; line-height: 1.5; color: var(--ink);
    text-shadow: 1px 1px 0 var(--shadow); pointer-events: none; font-variant-numeric: tabular-nums; white-space: pre; }
  #hotbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 2px solid var(--panel-edge); max-width: calc(100vw - 32px); }
  .slot { position: relative; width: 44px; height: 44px; flex: 0 1 44px; min-width: 28px; aspect-ratio: 1; background: var(--slot);
    border: 2px solid var(--slot-edge); box-sizing: border-box; cursor: pointer; }
  .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .slot.active { border-color: #fff; box-shadow: 0 0 0 2px var(--shadow), inset 0 0 0 2px var(--shadow); }
  .slot .num { position: absolute; right: 2px; bottom: 0; font-size: 10px; text-shadow: 1px 1px 0 #000; }
  #blockname { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    font-size: 15px; text-shadow: 1px 1px 0 var(--shadow); pointer-events: none; transition: opacity .4s; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8, 10, 6, 0.62); }
  .card { width: min(440px, 100%); box-sizing: border-box; background: var(--panel); border: 2px solid var(--panel-edge); padding: 22px 22px 18px;
    box-shadow: 6px 6px 0 rgba(0,0,0,.45); display: grid; gap: 14px; }
  .card h1 { margin: 0; font-size: 34px; letter-spacing: 2px; color: var(--accent); text-shadow: 3px 3px 0 #2c4a14; text-wrap: balance; }
  .card p { margin: 0; color: var(--ink-dim); font-size: 13px; line-height: 1.5; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; }
  .keys kbd { font: inherit; color: var(--ink); background: #2a2e24; border: 1px solid var(--slot-edge); padding: 0 6px; white-space: nowrap; justify-self: start; }
  .keys span { color: var(--ink-dim); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; color: var(--ink); background: #4c7a25; border: 2px solid #9fdc5c; padding: 9px 16px; cursor: pointer;
    box-shadow: inset -3px -3px 0 #325716, inset 3px 3px 0 #6ea23d; }
  button.secondary { background: #3a3e33; border-color: #6c7260; box-shadow: inset -3px -3px 0 #26291f, inset 3px 3px 0 #50554a; font-size: 13px; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch .pad { position: absolute; pointer-events: auto; }
  #stick { left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25); }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .tbtn { width: 58px; height: 58px; display: grid; place-items: center; font-size: 12px; color: #fff; background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.3); }
  #t-jump { right: 24px; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  #t-break { right: 96px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
  #t-place { right: 24px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
  #t-fly { right: 96px; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  #t-menu { right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); width: 44px; height: 44px; }
  @media (max-width: 480px) { .slot { width: 34px; height: 34px; } .card h1 { font-size: 28px; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
</head>
<body>
<canvas id="game"></canvas>
<div id="water-tint" hidden></div>
<div id="crosshair"></div>
<div id="info"></div>
<div id="blockname"></div>
<div id="hotbar"></div>

<div id="touch" hidden>
  <div id="stick" class="pad"><div id="knob"></div></div>
  <div id="t-jump" class="pad tbtn">JUMP</div>
  <div id="t-fly" class="pad tbtn">FLY</div>
  <div id="t-break" class="pad tbtn">BREAK</div>
  <div id="t-place" class="pad tbtn">PLACE</div>
  <div id="t-menu" class="pad tbtn">II</div>
</div>

<div id="overlay">
  <div class="card">
    <h1>BlockCraft</h1>
    <p id="loadmsg">월드를 생성하는 중…</p>
    <div class="keys" id="keys-desktop">
      <kbd>W A S D</kbd><span>이동</span>
      <kbd>마우스</kbd><span>시점 회전</span>
      <kbd>Space</kbd><span>점프 / 수영 / 비행 상승</span>
      <kbd>Shift</kbd><span>달리기 / 비행 하강</span>
      <kbd>F</kbd><span>비행 모드 켜기/끄기</span>
      <kbd>좌클릭</kbd><span>블록 부수기</span>
      <kbd>우클릭</kbd><span>블록 설치</span>
      <kbd>휠클릭</kbd><span>보고 있는 블록 선택</span>
      <kbd>1-9 / 휠</kbd><span>블록 고르기</span>
      <kbd>F3</kbd><span>디버그 정보</span>
      <kbd>Esc</kbd><span>일시정지</span>
    </div>
    <p id="keys-touch" hidden>왼쪽 스틱으로 이동, 화면을 드래그해서 시점을 돌립니다. 버튼으로 점프·비행·부수기·설치, 아래 칸을 눌러 블록을 고릅니다.</p>
    <div class="btns">
      <button id="play" type="button" disabled>플레이</button>
      <button id="newworld" class="secondary" type="button">새 월드</button>
    </div>
    <p id="savemsg">변경 사항은 이 브라우저에 자동 저장됩니다.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- 상수 ----------
const CS = 16;            // 청크 가로/세로
const CH = 96;            // 월드 높이
const SEA = 30;           // 해수면
const RENDER = 6;         // 렌더 거리(청크)
const SAVE_KEY = 'blockcraft-save-v1';

const B = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, SAND: 4, LOG: 5, LEAVES: 6, WATER: 7, PLANKS: 8,
  COBBLE: 9, GLASS: 10, BRICK: 11, SNOW: 12, BEDROCK: 13 };

// 타일 인덱스
const T = { GRASS_TOP: 0, GRASS_SIDE: 1, DIRT: 2, STONE: 3, SAND: 4, LOG_SIDE: 5, LOG_TOP: 6, LEAVES: 7,
  WATER: 8, PLANKS: 9, COBBLE: 10, GLASS: 11, BRICK: 12, SNOW: 13, SNOW_SIDE: 14, BEDROCK: 15 };
const NT = 16;

// tex: [top, bottom, side]
const BLOCKS = [];
BLOCKS[B.AIR]     = { name: '공기', transparent: true, solid: false };
BLOCKS[B.GRASS]   = { name: '잔디', tex: [T.GRASS_TOP, T.DIRT, T.GRASS_SIDE] };
BLOCKS[B.DIRT]    = { name: '흙', tex: [T.DIRT, T.DIRT, T.DIRT] };
BLOCKS[B.STONE]   = { name: '돌', tex: [T.STONE, T.STONE, T.STONE] };
BLOCKS[B.SAND]    = { name: '모래', tex: [T.SAND, T.SAND, T.SAND] };
BLOCKS[B.LOG]     = { name: '나무', tex: [T.LOG_TOP, T.LOG_TOP, T.LOG_SIDE] };
BLOCKS[B.LEAVES]  = { name: '나뭇잎', tex: [T.LEAVES, T.LEAVES, T.LEAVES], transparent: true, ao: true };
BLOCKS[B.WATER]   = { name: '물', tex: [T.WATER, T.WATER, T.WATER], transparent: true, solid: false, liquid: true };
BLOCKS[B.PLANKS]  = { name: '나무 판자', tex: [T.PLANKS, T.PLANKS, T.PLANKS] };
BLOCKS[B.COBBLE]  = { name: '조약돌', tex: [T.COBBLE, T.COBBLE, T.COBBLE] };
BLOCKS[B.GLASS]   = { name: '유리', tex: [T.GLASS, T.GLASS, T.GLASS], transparent: true };
BLOCKS[B.BRICK]   = { name: '벽돌', tex: [T.BRICK, T.BRICK, T.BRICK] };
BLOCKS[B.SNOW]    = { name: '눈 덮인 흙', tex: [T.SNOW, T.DIRT, T.SNOW_SIDE] };
BLOCKS[B.BEDROCK] = { name: '기반암', tex: [T.BEDROCK, T.BEDROCK, T.BEDROCK], unbreakable: true };
for (const b of BLOCKS) {
  if (b.solid === undefined) b.solid = true;
  if (b.transparent === undefined) b.transparent = false;
  if (b.ao === undefined) b.ao = !b.transparent;
}
const SOLID = new Uint8Array(BLOCKS.length), TRANSP = new Uint8Array(BLOCKS.length), OCC = new Uint8Array(BLOCKS.length);
BLOCKS.forEach((b, i) => { SOLID[i] = b.solid ? 1 : 0; TRANSP[i] = b.transparent ? 1 : 0; OCC[i] = b.ao ? 1 : 0; });

const HOTBAR = [B.GRASS, B.DIRT, B.STONE, B.COBBLE, B.PLANKS, B.LOG, B.GLASS, B.BRICK, B.SAND];

// ---------- 저장 ----------
let save = null;
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { save = null; }
let SEED = save && save.seed ? save.seed : (Math.random() * 1e9) | 0;
const edits = new Map(); // "cx,cz" -> Map(idx -> id)
if (save && save.edits) {
  for (const k in save.edits) edits.set(k, new Map(save.edits[k]));
}
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeSave, 800);
}
function writeSave() {
  const obj = { seed: SEED, edits: {}, player: [player.pos.x, player.pos.y, player.pos.z, player.yaw, player.pitch, player.flying] };
  for (const [k, m] of edits) if (m.size) obj.edits[k] = [...m];
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); } catch (e) { /* 저장 불가 환경은 무시 */ }
}

// ---------- 난수 / 노이즈 ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makePerlin(seed) {
  const rnd = mulberry32(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  function grad2(h, x, y) {
    switch (h & 7) {
      case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y;
      case 4: return x; case 5: return -x; case 6: return y; default: return -y;
    }
  }
  function grad3(h, x, y, z) {
    const hh = h & 15, u = hh < 8 ? x : y, v = hh < 4 ? y : (hh === 12 || hh === 14 ? x : z);
    return ((hh & 1) ? -u : u) + ((hh & 2) ? -v : v);
  }
  return {
    n2(x, y) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
      x -= Math.floor(x); y -= Math.floor(y);
      const u = fade(x), v = fade(y);
      const a = perm[X] + Y, b = perm[X + 1] + Y;
      return lerp(lerp(grad2(perm[a], x, y), grad2(perm[b], x - 1, y), u),
                  lerp(grad2(perm[a + 1], x, y - 1), grad2(perm[b + 1], x - 1, y - 1), u), v) * 0.7;
    },
    n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
      const Bq = perm[X + 1] + Y, BA = perm[Bq] + Z, BB = perm[Bq + 1] + Z;
      return lerp(lerp(lerp(grad3(perm[AA], x, y, z), grad3(perm[BA], x - 1, y, z), u),
                       lerp(grad3(perm[AB], x, y - 1, z), grad3(perm[BB], x - 1, y - 1, z), u), v),
                  lerp(lerp(grad3(perm[AA + 1], x, y, z - 1), grad3(perm[BA + 1], x - 1, y, z - 1), u),
                       lerp(grad3(perm[AB + 1], x, y - 1, z - 1), grad3(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
  };
}
let noise, noise2, noiseCave;
function initNoise() {
  noise = makePerlin(SEED);
  noise2 = makePerlin(SEED ^ 0x5bd1e995);
  noiseCave = makePerlin(SEED ^ 0x1b873593);
}
initNoise();
function fbm(n, x, y, oct) {
  let s = 0, a = 1, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += n.n2(x * f, y * f) * a; norm += a; a *= 0.5; f *= 2; }
  return s / norm;
}
function hash2(x, z, salt) {
  let h = Math.imul(x, 374761393) ^ Math.imul(z, 668265263) ^ Math.imul(SEED + salt, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------- 지형 ----------
function terrainHeight(x, z) {
  const base = fbm(noise, x * 0.008, z * 0.008, 4);
  const hills = fbm(noise2, x * 0.02, z * 0.02, 3);
  let m = fbm(noise2, x * 0.003 + 100, z * 0.003 - 100, 3);
  m = Math.max(0, m + 0.1);
  const h = SEA + 2 + base * 14 + hills * 4 + m * m * 90;
  return Math.max(2, Math.min(CH - 12, Math.floor(h)));
}

const chunks = new Map();
const key = (cx, cz) => cx + ',' + cz;
const vidx = (x, y, z) => (y * CS + z) * CS + x;

function generateChunk(cx, cz) {
  const data = new Uint8Array(CS * CS * CH);
  const x0 = cx * CS, z0 = cz * CS;
  const PAD = 3, W = CS + PAD * 2;
  const heights = new Int16Array(W * W);
  for (let z = 0; z < W; z++) for (let x = 0; x < W; x++) heights[z * W + x] = terrainHeight(x0 + x - PAD, z0 + z - PAD);

  for (let z = 0; z < CS; z++) for (let x = 0; x < CS; x++) {
    const h = heights[(z + PAD) * W + (x + PAD)];
    const wx = x0 + x, wz = z0 + z;
    const beach = h <= SEA + 1;
    const snowy = h > 62 + hash2(wx, wz, 7) * 4;
    const dirtDepth = 3 + (hash2(wx, wz, 3) * 2 | 0);
    for (let y = 0; y < CH; y++) {
      let id = B.AIR;
      if (y === 0) id = B.BEDROCK;
      else if (y <= h) {
        if (y === h) id = beach ? B.SAND : (snowy ? B.SNOW : B.GRASS);
        else if (y > h - dirtDepth) id = beach ? B.SAND : B.DIRT;
        else id = B.STONE;
        // 동굴
        if (y > 1 && y < h - 4) {
          const c = noiseCave.n3(wx * 0.055, y * 0.09, wz * 0.055);
          if (c > 0.42) id = B.AIR;
        }
      } else if (y <= SEA) id = B.WATER;
      data[vidx(x, y, z)] = id;
    }
  }

  // 나무 (인접 청크에서 넘어오는 나뭇잎 포함)
  for (let tz = -2; tz < CS + 2; tz++) for (let tx = -2; tx < CS + 2; tx++) {
    const wx = x0 + tx, wz = z0 + tz;
    if (hash2(wx, wz, 11) > 0.012) continue;
    const h = heights[(tz + PAD) * W + (tx + PAD)];
    if (h <= SEA + 1 || h > 60) continue;
    const trunk = 4 + (hash2(wx, wz, 13) * 3 | 0);
    const set = (x, y, z, id, onlyAir) => {
      if (x < 0 || x >= CS || z < 0 || z >= CS || y < 0 || y >= CH) return;
      const i = vidx(x, y, z);
      if (onlyAir && data[i] !== B.AIR) return;
      data[i] = id;
    };
    // 캐니언 위 공중 나무 방지: 지면이 실제로 있는지 확인은 생성된 청크 내부에서만 가능하므로 높이값 기준
    for (let dy = trunk - 2; dy <= trunk + 1; dy++) {
      const r = dy >= trunk ? 1 : 2;
      for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) === r && Math.abs(dz) === r && (r === 1 ? dy === trunk + 1 : hash2(wx + dx, wz + dz + dy, 17) < 0.5)) continue;
        set(tx + dx, h + dy, tz + dz, B.LEAVES, true);
      }
    }
    for (let dy = 1; dy <= trunk; dy++) set(tx, h + dy, tz, B.LOG, false);
    set(tx, h, tz, B.DIRT, false);
  }

  const e = edits.get(key(cx, cz));
  if (e) for (const [i, id] of e) data[i] = id;

  const c = { cx, cz, data, mesh: null, water: null, dirty: true };
  chunks.set(key(cx, cz), c);
  return c;
}

function getBlock(x, y, z) {
  if (y < 0) return B.BEDROCK;
  if (y >= CH) return B.AIR;
  const cx = Math.floor(x / CS), cz = Math.floor(z / CS);
  const c = chunks.get(key(cx, cz));
  if (!c) return B.AIR;
  return c.data[vidx(x - cx * CS, y, z - cz * CS)];
}
function chunkLoadedAt(x, z) { return chunks.has(key(Math.floor(x / CS), Math.floor(z / CS))); }

function setBlock(x, y, z, id) {
  if (y < 0 || y >= CH) return;
  const cx = Math.floor(x / CS), cz = Math.floor(z / CS);
  const k = key(cx, cz);
  const c = chunks.get(k);
  if (!c) return;
  const lx = x - cx * CS, lz = z - cz * CS, i = vidx(lx, y, lz);
  c.data[i] = id;
  let m = edits.get(k);
  if (!m) { m = new Map(); edits.set(k, m); }
  m.set(i, id);
  // 이 블록이 패딩 영역에 걸치는 모든 청크를 다시 메시화
  const xs = new Set([Math.floor((x - 1) / CS), cx, Math.floor((x + 1) / CS)]);
  const zs = new Set([Math.floor((z - 1) / CS), cz, Math.floor((z + 1) / CS)]);
  for (const ax of xs) for (const az of zs) {
    const n = chunks.get(key(ax, az));
    if (n && (n.mesh || n.water || (ax === cx && az === cz))) buildMesh(n);
  }
  scheduleSave();
}

// ---------- 텍스처 아틀라스 ----------
const TILE = 16;
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = TILE * NT; atlasCanvas.height = TILE;
(function paintAtlas() {
  const ctx = atlasCanvas.getContext('2d');
  const img = ctx.createImageData(TILE * NT, TILE);
  const rnd = mulberry32(1234);
  const clamp = v => Math.max(0, Math.min(255, v | 0));
  function tile(t, fn) {
    for (let y = 0; y < TILE; y++) for (let x = 0; x < TILE; x++) {
      const c = fn(x, y);
      const o = (y * TILE * NT + t * TILE + x) * 4;
      img.data[o] = clamp(c[0]); img.data[o + 1] = clamp(c[1]); img.data[o + 2] = clamp(c[2]);
      img.data[o + 3] = c[3] === undefined ? 255 : c[3];
    }
  }

  const id = HOTBAR[selected];
  const p = player.pos;
  if (SOLID[id] && x + 1 > p.x - PW && x < p.x + PW && y + 1 > p.y && y < p.y + PH && z + 1 > p.z - PW && z < p.z + PW) return;
  setBlock(x, y, z, id);
}
function pickBlock() {
  const hit = raycast(6);
  if (!hit) return;
  const i = HOTBAR.indexOf(hit.id);
  if (i >= 0) selectSlot(i);
  else { HOTBAR[selected] = hit.id; drawSlot(selected); selectSlot(selected); }
}

// ---------- 핫바 UI ----------
const hotbarEl = document.getElementById('hotbar');
const nameEl = document.getElementById('blockname');
let selected = 0, nameTimer = null;
const slotCanvases = [];
HOTBAR.forEach((id, i) => {
  const s = document.createElement('div');
  s.className = 'slot';
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
  s.append(c, num);
  s.addEventListener('pointerdown', ev => { ev.stopPropagation(); selectSlot(i); });
  hotbarEl.appendChild(s);
  slotCanvases.push(c);
  drawSlot(i);
});
function drawSlot(i) {
  const c = slotCanvases[i], g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 32, 32);
  const t = BLOCKS[HOTBAR[i]].tex[2];
  g.drawImage(atlasCanvas, t * TILE, 0, TILE, TILE, 4, 4, 24, 24);
}
function selectSlot(i) {
  selected = (i + HOTBAR.length) % HOTBAR.length;
  [...hotbarEl.children].forEach((el, j) => el.classList.toggle('active', j === selected));
  nameEl.textContent = BLOCKS[HOTBAR[selected]].name;
  nameEl.style.opacity = 1;
  clearTimeout(nameTimer);
  nameTimer = setTimeout(() => nameEl.style.opacity = 0, 1500);
}
selectSlot(0);

// ---------- 입력 ----------
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('play');
const isTouch = matchMedia('(pointer: coarse)').matches;
let playing = false, lockFallback = false, showDebug = true;
const mouse = { left: false, right: false, repeat: 0 };

if (isTouch) {
  document.getElementById('keys-desktop').hidden = true;
  document.getElementById('keys-touch').hidden = false;
}

function startPlaying() {
  overlay.hidden = true;
  playing = true;
  if (isTouch) { document.getElementById('touch').hidden = false; return; }
  lockFallback = false;
  if (canvas.requestPointerLock) {
    try {
      const r = canvas.requestPointerLock();
      if (r && r.catch) r.catch(() => { lockFallback = true; });
    } catch (e) { lockFallback = true; }
  } else lockFallback = true;
}
function pause() {
  playing = false;
  keys.clear(); mouse.left = mouse.right = false;
  overlay.hidden = false;
  document.getElementById('touch').hidden = true;
  writeSave();
}
playBtn.addEventListener('click', startPlaying);
document.getElementById('newworld').addEventListener('click', () => {
  SEED = (Math.random() * 1e9) | 0;
  edits.clear();
  for (const c of chunks.values()) disposeMeshes(c);
  chunks.clear(); lastCenter = null;
  initNoise();
  const s = findSpawn();
  player.pos.set(s[0], s[1], s[2]); player.vel.set(0, 0, 0); player.flying = false;
  writeSave();
  preload();
  startPlaying();
});
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== canvas && playing && !lockFallback) pause();
});
document.addEventListener('pointerlockerror', () => { lockFallback = true; });

function look(dx, dy, sens) {
  player.yaw -= dx * sens;
  player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch - dy * sens));
}
let dragStart = null;
document.addEventListener('mousemove', e => {
  if (!playing || isTouch) return;
  if (Math.abs(e.movementX) > 250 || Math.abs(e.movementY) > 250) return; // 포인터 잠금 직후 튀는 값 무시
  if (document.pointerLockElement === canvas) look(e.movementX, e.movementY, 0.0022);
  else if (lockFallback && dragStart) {
    look(e.movementX, e.movementY, 0.005);
    dragStart.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
  }
});
canvas.addEventListener('mousedown', e => {
  if (!playing || isTouch) return;
  if (lockFallback && document.pointerLockElement !== canvas) {
    dragStart = { button: e.button, moved: 0 };
    return;
  }
  if (e.button === 0) { breakBlock(); mouse.left = true; mouse.repeat = 0.3; }
  else if (e.button === 2) { placeBlock(); mouse.right = true; mouse.repeat = 0.3; }
  else if (e.button === 1) { e.preventDefault(); pickBlock(); }
});
document.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.left = false;
  if (e.button === 2) mouse.right = false;
  if (dragStart) {
    if (dragStart.moved < 6) {
      if (dragStart.button === 0) breakBlock();
      else if (dragStart.button === 2) placeBlock();
      else if (dragStart.button === 1) pickBlock();
    }
    dragStart = null;
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('wheel', e => {
  if (!playing) return;
  selectSlot(selected + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });
document.addEventListener('keydown', e => {
  if (!playing) {
    if ((e.code === 'Enter') && !playBtn.disabled && !overlay.hidden) startPlaying();
    return;
  }
  if (e.code === 'Escape' && lockFallback) { pause(); return; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'F3', 'Tab'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.code.startsWith('Digit')) { const n = +e.code.slice(5); if (n >= 1 && n <= 9) selectSlot(n - 1); }
  if (e.code === 'KeyF' && !e.repeat) { player.flying = !player.flying; player.vel.y = 0; }
  if (e.code === 'F3') showDebug = !showDebug;
});
document.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); mouse.left = mouse.right = false; });

// 터치 조작
if (isTouch) {
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let stickId = null, lookId = null, lastLook = null;
  const stickRect = () => stick.getBoundingClientRect();
  stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
  const endStick = e => { if (e.pointerId !== stickId) return; stickId = null; touchMove.x = touchMove.y = 0; knob.style.transform = ''; };
  stick.addEventListener('pointerup', endStick); stick.addEventListener('pointercancel', endStick);
  function moveStick(e) {
    const r = stickRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2);
    const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
    touchMove.x = dx; touchMove.y = dy;
    knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`;
  }
  canvas.addEventListener('pointerdown', e => { if (!playing) return; lookId = e.pointerId; lastLook = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerId !== lookId || !lastLook) return;
    look(e.clientX - lastLook[0], e.clientY - lastLook[1], 0.006);
    lastLook = [e.clientX, e.clientY];
  });
  const endLook = e => { if (e.pointerId === lookId) { lookId = null; lastLook = null; } };
  canvas.addEventListener('pointerup', endLook); canvas.addEventListener('pointercancel', endLook);
  const hold = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
    el.addEventListener('pointerup', () => up && up());
    el.addEventListener('pointercancel', () => up && up());
    el.addEventListener('pointerleave', () => up && up());
  };
  hold('t-jump', () => touchState.jump = true, () => touchState.jump = false);
  hold('t-fly', () => { player.flying = !player.flying; player.vel.y = 0; });
  hold('t-break', () => { breakBlock(); mouse.left = true; mouse.repeat = 0.3; }, () => mouse.left = false);
  hold('t-place', () => { placeBlock(); mouse.right = true; mouse.repeat = 0.3; }, () => mouse.right = false);
  hold('t-menu', pause);
}

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
window.addEventListener('beforeunload', writeSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });

// ---------- 낮/밤 ----------
const DAY_LEN = 600;
let worldTime = DAY_LEN * 0.3;
const daySky = new THREE.Color(0x88c0ff), nightSky = new THREE.Color(0x0b1026), duskSky = new THREE.Color(0xf29a5a);
const waterFog = new THREE.Color(0x1d3f8a);
function updateSky(dt) {
  worldTime = (worldTime + dt) % DAY_LEN;
  const ang = (worldTime / DAY_LEN) * Math.PI * 2;       // 0 = 해 뜸
  const h = Math.sin(ang);
  const light = Math.max(0.22, Math.min(1, 0.5 + h * 1.2));
  skyColor.copy(nightSky).lerp(daySky, Math.max(0, Math.min(1, 0.4 + h * 1.6)));
  const dusk = Math.max(0, 1 - Math.abs(h) * 4) * 0.55;
  skyColor.lerp(duskSky, dusk);
  const lc = light;
  solidMat.color.setRGB(lc, lc, lc);
  waterMat.color.setRGB(lc, lc, lc);
  clouds.material.color.setRGB(lc, lc, lc);
  const cp = camera.position;
  sun.position.set(cp.x + Math.cos(ang) * 300, cp.y + Math.sin(ang) * 300, cp.z);
  moon.position.set(cp.x - Math.cos(ang) * 300, cp.y - Math.sin(ang) * 300, cp.z);
  sun.lookAt(cp); moon.lookAt(cp);
  sun.visible = h > -0.15; moon.visible = h < 0.15;
  clouds.position.x = cp.x - ((cp.x + worldTime * 1.5) % 384);
  clouds.position.z = cp.z - (cp.z % 384);
  if (player.headInWater) {
    scene.fog.color.copy(waterFog).multiplyScalar(light);
    scene.background = scene.fog.color;
    scene.fog.near = 0.1; scene.fog.far = 18;
  } else {
    scene.fog.color.copy(skyColor);
    scene.background = skyColor;
    scene.fog.near = RENDER * CS * 0.45; scene.fog.far = RENDER * CS * 0.95;
  }
}

// ---------- 루프 ----------
const infoEl = document.getElementById('info');
const tintEl = document.getElementById('water-tint');
let last = performance.now(), fpsLast = last, fpsAcc = 0, fpsN = 0, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  fpsAcc += (now - fpsLast) / 1000; fpsLast = now; fpsN++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }

  updateChunks(playing ? 6 : 12);
  if (playing) {
    physics(dt);
    if (mouse.left || mouse.right) {
      mouse.repeat -= dt;
      if (mouse.repeat <= 0) { mouse.repeat = 0.22; if (mouse.left) breakBlock(); else placeBlock(); }
    }
  }
  camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  updateSky(dt);
  tintEl.hidden = !player.headInWater;

  const hit = raycast(6);
  if (hit && playing) { highlight.visible = true; highlight.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5); }
  else highlight.visible = false;

  if (showDebug) {
    const p = player.pos;
    infoEl.textContent = `BlockCraft  ${fps} fps\nXYZ ${p.x.toFixed(1)} / ${p.y.toFixed(1)} / ${p.z.toFixed(1)}\n` +
      `청크 ${chunks.size}  ${player.flying ? '비행 중' : ''}`;
  } else infoEl.textContent = '';
  renderer.render(scene, camera);
}

// ---------- 시작 ----------
function preload() {
  const pcx = Math.floor(player.pos.x / CS), pcz = Math.floor(player.pos.z / CS);
  for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) if (!chunks.has(key(pcx + dx, pcz + dz))) generateChunk(pcx + dx, pcz + dz);
  for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) buildMesh(chunks.get(key(pcx + dx, pcz + dz)));
  // 블록 안에 끼어 있으면 위로 올림
  while (collides(player.pos.x, player.pos.y, player.pos.z) && player.pos.y < CH) player.pos.y += 1;
}
if (!(save && save.player)) { const s = findSpawn(); player.pos.set(s[0], s[1], s[2]); }
setTimeout(() => {
  preload();
  document.getElementById('loadmsg').textContent = '블록을 부수고 쌓아서 원하는 것을 지어 보세요.';
  playBtn.disabled = false;
  playBtn.focus();
  requestAnimationFrame(frame);
}, 30);
})();
</script>
</body>
